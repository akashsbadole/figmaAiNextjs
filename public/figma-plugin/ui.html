<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Design Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a2e;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 320px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      color: #8892b0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #ccd6f6;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      background: #16213e;
      border: 1px solid #2d3a5f;
      border-radius: 6px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #64ffda;
    }

    .form-group input::placeholder {
      color: #5a6a8a;
    }

    .btn {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: #64ffda;
      color: #1a1a2e;
    }

    .btn-primary:hover {
      background: #4de8c5;
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      background: #2d3a5f;
      color: #5a6a8a;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: transparent;
      color: #64ffda;
      border: 1px solid #64ffda;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: rgba(100, 255, 218, 0.1);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #1a1a2e;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }

    .status.success {
      background: rgba(100, 255, 218, 0.15);
      border: 1px solid rgba(100, 255, 218, 0.3);
      color: #64ffda;
      display: block;
    }

    .status.error {
      background: rgba(255, 107, 107, 0.15);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ff6b6b;
      display: block;
    }

    .status.loading {
      background: rgba(100, 255, 218, 0.1);
      border: 1px solid rgba(100, 255, 218, 0.2);
      color: #8892b0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-list {
      margin-top: 16px;
      font-size: 11px;
      color: #8892b0;
    }

    .progress-item {
      padding: 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-item.done {
      color: #64ffda;
    }

    .progress-item .icon {
      width: 14px;
      height: 14px;
    }

    .preview {
      margin-top: 16px;
      padding: 12px;
      background: #16213e;
      border-radius: 6px;
      display: none;
    }

    .preview.show {
      display: block;
    }

    .preview-title {
      font-size: 12px;
      font-weight: 600;
      color: #ccd6f6;
      margin-bottom: 8px;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>System Design Generator</h1>
      <p>Import your design tokens to Figma</p>
    </div>

    <div class="form-group">
      <label for="apiUrl">Your App URL</label>
      <input type="text" id="apiUrl" placeholder="http://localhost:3000">
    </div>

    <div class="form-group">
      <label for="designId">Design System ID</label>
      <input type="text" id="designId" placeholder="Enter design system ID">
    </div>

    <button class="btn btn-primary" id="importBtn">
      <span class="btn-text">Import & Create Design</span>
    </button>

    <button class="btn btn-secondary" id="sampleBtn">
      Load Sample Design
    </button>

    <div class="status" id="status"></div>
    <div class="progress-list" id="progress"></div>
    <div class="preview" id="preview"></div>
  </div>

  <script src="code.js"></script>
</body>
</html>
